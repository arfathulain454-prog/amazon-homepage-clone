<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Sign In</title>
  <link rel="stylesheet" href="signin.css" />
</head>
<body>
  <div class="container">
    <img src="amazon_logo.png" alt="Amazon Logo" width="100"/>
    <div class="form-box">
      <h2>Sign in or create account</h2>
      <label for="email">Enter mobile number or email</label>
      <input type="text" id="email" />
      <button class="continue-btn">Continue</button>
      <p class="disclaimer">
        By continuing, you agree to Amazon's
        <a href="#">Conditions of Use</a> and
        <a href="#">Privacy Notice</a>.
      </p>
      <a class="help-link" href="#">Need help?</a>
      <hr />
      <p class="work-text"><strong>Buying for work?</strong></p>
      <a class="business-link" href="#">Create a free business account</a>
    </div>
    <footer>
      <div class="footer-links">
        <a href="#">Conditions of Use</a>
        <a href="#">Privacy Notice</a>
        <a href="#">Help</a>
      </div>
      <p class="copyright">© 1996–2025, Amazon.com, Inc. or its affiliates</p>
    </footer>
  </div>
</body>
</html>
